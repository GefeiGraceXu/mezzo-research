# 每日数据抓取 —— 现在是「装好但没开」的状态。
#
# 当前：只能在 GitHub 网页上手动点 Run workflow 触发（用来试跑）。
# 将来要开启自动运行：把下面 schedule 那三行的 # 去掉即可，别的都不用改。
#
# 它干的事：跑 scripts/fetch/ 里的抓取脚本 -> 把结果写进 src/data/*.json
#           -> 只提交 src/data/ 这一个目录 -> Cloudflare Pages 自动重新构建发布。
#
# 注意：它只碰 src/data/，永远不会动 src/posts/ 里你手写的文章。

name: 每日数据抓取

on:
  workflow_dispatch: # 手动触发，现在唯一的入口
  # schedule:
  #   # UTC 时间，23:00 UTC = 北京时间次日 07:00
  #   - cron: '0 23 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # 抓取脚本还没写。将来在 scripts/fetch/ 下加脚本，然后在这里调用：
      # - run: node scripts/fetch/assets.mjs
      # - run: node scripts/fetch/news.mjs
      - name: 抓取数据
        run: echo "抓取脚本尚未启用"

      - name: 提交数据变更
        run: |
          git config user.name  "mezzo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data
          git diff --staged --quiet || git commit -m "数据更新 $(date -u +%Y-%m-%d)"
          git push
